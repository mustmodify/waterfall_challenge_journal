<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-Z01BFBJM7V"></script>
  <script src="/static/analytics.js"></script>
  <title>Confusion sets &middot; Wanderfall</title>
  <script src="/static/theme.js"></script>
  <link rel="stylesheet" href="/static/app.css" />
  <link rel="icon" href="/static/favicon-32.png" sizes="32x32">
  <link rel="icon" href="/static/favicon-16.png" sizes="16x16">
  <link rel="icon" href="/static/favicon-48.png" sizes="48x48">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Metamorphous&display=swap" rel="stylesheet">
  <style>
    body { padding: 0 0 64px; }
    .wrap { max-width: 820px; margin: 0 auto; padding: 0 16px; }
    a { color: var(--accent); }

    header.bar {
      display: flex; align-items: baseline; gap: 14px;
      flex-wrap: wrap; padding: 20px 0 6px;
    }
    header.bar h1 {
      margin: 0; font-family: 'Metamorphous', serif; font-weight: 400; font-size: 1.5rem;
    }
    header.bar nav { margin-left: auto; display: flex; gap: 12px; flex-wrap: wrap; }

    .lede { color: var(--haze); font-size: 0.9rem; margin: 6px 0 18px; max-width: 64ch; }

    .set {
      border: 1px solid var(--line); border-radius: var(--radius);
      padding: 13px 15px; margin-bottom: 12px;
    }
    .set .name { font-weight: 600; font-size: 1.05rem; }
    .set .counts { color: var(--haze); font-size: 0.85rem; margin-top: 4px; }

    .members { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 22px; }
    .members a {
      border: 1px solid var(--line); border-radius: 999px;
      padding: 4px 12px; font-size: 0.85rem; text-decoration: none;
    }
    .members a:hover { background: var(--moss); }

    .entry {
      border-left: 3px solid var(--line); padding: 2px 0 2px 14px; margin-bottom: 20px;
    }
    .entry:first-of-type { border-left-color: var(--accent); }
    .entry .meta {
      color: var(--haze); font-size: 0.75rem; text-transform: uppercase;
      letter-spacing: 0.08em; margin-bottom: 6px;
    }
    .entry .body { white-space: pre-wrap; line-height: 1.55; font-size: 0.93rem; }

    form.add { margin-top: 8px; }
    form.add textarea {
      width: 100%; min-height: 110px; padding: 10px;
      border: 1px solid var(--line); border-radius: 8px;
      background: var(--field-bg); color: var(--mist); font: inherit;
      font-size: 0.9rem; resize: vertical;
    }
    form.add .row { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
    form.add .hint { color: var(--haze); font-size: 0.8rem; }

    .empty, .note { color: var(--haze); font-size: 0.9rem; }
    h2 { font-family: 'Metamorphous', serif; font-weight: 400; font-size: 1.1rem;
      margin: 26px 0 10px; }
  </style>
</head>

<body>
  <div class="wrap">
    <header class="bar">
      <h1 id="title">Confusion sets</h1>
      <nav id="nav"></nav>
    </header>

    <div id="denied" class="empty" hidden>
      This view is for whoever looks after the data.
      <a href="/">Sign in on the map</a> if that's you.
    </div>

    <div id="content" hidden></div>
  </div>

  <script src="/static/admin-nav.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    const m = /^\/admin\/confusion_sets\/(\d+)$/.exec(location.pathname);
    const setId = m ? m[1] : null;

    function guard(rs) {
      if (rs.some((r) => r.status === 401 || r.status === 403)) {
        $('denied').hidden = false; return false;
      }
      return true;
    }

    if (setId) {
      Promise.all([
        fetch('/admin/confusion-set/' + setId),
        fetch('/corrections?status=open'),
      ]).then((rs) => {
        if (!guard(rs)) return null;
        return Promise.all(rs.map((r) => r.json()));
      }).then((data) => { if (data) renderSet(data[0], data[1].length); });
    } else {
      Promise.all([
        fetch('/admin/confusion-set-list'),
        fetch('/corrections?status=open'),
      ]).then((rs) => {
        if (!guard(rs)) return null;
        return Promise.all(rs.map((r) => r.json()));
      }).then((data) => { if (data) renderList(data[0], data[1].length); });
    }

    function renderList(sets, corrections) {
      $('content').hidden = false;
      renderNav('confusion', corrections);
      const lede = '<p class="lede">Clusters of waterfalls that are genuinely ' +
        'different and correctly named but easy to mistake for each other. Each ' +
        'one keeps a journal rather than a single description, so what we used ' +
        'to think stays readable next to what we think now.</p>';
      if (!sets.length) {
        $('content').innerHTML = lede + '<p class="empty">No sets yet.</p>';
        return;
      }
      $('content').innerHTML = lede + sets.map((s) =>
        '<div class="set">' +
        '<div class="name"><a href="/admin/confusion_sets/' + s.id + '">' +
        esc(s.name) + '</a></div>' +
        '<div class="counts">' + s.members + ' member' + (s.members === 1 ? '' : 's') +
        ' &middot; ' + s.entries + ' journal entr' + (s.entries === 1 ? 'y' : 'ies') +
        '</div></div>').join('');
    }

    function renderSet(set, corrections) {
      $('content').hidden = false;
      renderNav('confusion', corrections);
      $('title').textContent = set.name;
      document.title = set.name + ' · Wanderfall';

      const members = set.members.map((mem) =>
        '<a href="/admin/claims?feature=' + mem.feature_id + '">' + esc(mem.name) +
        '</a>').join('');

      const entries = set.entries.length
        ? set.entries.map((e) =>
            '<div class="entry"><div class="meta">' + esc(e.created_at.slice(0, 10)) +
            ' &middot; ' + esc(e.author) + '</div>' +
            '<div class="body">' + esc(e.body) + '</div></div>').join('')
        : '<p class="empty">Nothing recorded yet.</p>';

      $('content').innerHTML =
        '<p class="lede"><a href="/admin/confusion_sets">&larr; All sets</a></p>' +
        '<h2>Members</h2><div class="members">' + members + '</div>' +
        '<h2>Journal</h2>' +
        '<p class="note">Newest first. Entries are never edited or deleted &mdash; ' +
        'the database refuses both. A changed conclusion is a new entry.</p>' +
        entries +
        '<h2>Add an entry</h2>' +
        '<form class="add" id="add">' +
        '<textarea id="body" placeholder="What we now believe, and what changed."></textarea>' +
        '<div class="row"><button class="primary" type="submit">Append</button>' +
        '<span class="hint">Signed as you. Only sign as someone else when the ' +
        'words are theirs verbatim.</span></div></form>';

      $('add').addEventListener('submit', (ev) => {
        ev.preventDefault();
        const body = $('body').value;
        if (!body.trim()) return;
        fetch('/admin/confusion-set/' + set.id + '/entries', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ body: body }),
        }).then((r) => {
          if (!r.ok) { alert('Could not save that entry.'); return; }
          location.reload();
        });
      });
    }
  </script>
</body>

</html>
