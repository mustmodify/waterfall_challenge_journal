<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-Z01BFBJM7V"></script>
  <script src="/static/analytics.js"></script>
  <title>Admin &middot; Wanderfall</title>
  <script src="/static/theme.js"></script>
  <link rel="stylesheet" href="/static/app.css" />
  <link rel="icon" href="/static/favicon-32.png" sizes="32x32">
  <link rel="icon" href="/static/favicon-16.png" sizes="16x16">
  <link rel="icon" href="/static/favicon-48.png" sizes="48x48">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Metamorphous&display=swap" rel="stylesheet">
  <style>
    body { padding: 0 0 64px; }
    .wrap { max-width: 880px; margin: 0 auto; padding: 0 16px; }
    a { color: var(--accent); }

    header.bar {
      display: flex; align-items: baseline; gap: 14px;
      flex-wrap: wrap; padding: 20px 0 6px;
    }
    header.bar h1 {
      margin: 0; font-family: 'Metamorphous', serif; font-weight: 400; font-size: 1.5rem;
    }
    header.bar nav { margin-left: auto; display: flex; gap: 12px; flex-wrap: wrap; }

    .empty, .note { color: var(--haze); font-size: 0.9rem; }

    .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
             gap: 12px; margin-top: 18px; }
    .tile {
      border: 1px solid var(--line); border-radius: var(--radius);
      padding: 16px; text-decoration: none; color: inherit;
      display: block;
    }
    .tile:hover { border-color: var(--accent); }
    .tile .n { font-family: 'Metamorphous', serif; font-size: 2rem; font-weight: 400; line-height: 1; }
    .tile .label { color: var(--haze); font-size: 0.85rem; margin-top: 6px; }
  </style>
</head>

<body>
  <div class="wrap">
    <header class="bar">
      <h1>Admin</h1>
      <nav id="nav"></nav>
    </header>

    <div id="denied" class="empty" hidden>
      This area is for whoever looks after the site.
      <a href="/">Sign in on the map</a> if that's you.
    </div>

    <div id="content" hidden>
      <p class="note">A place to see everything the site holds and whatever
        is still waiting on a decision.</p>
      <div class="tiles" id="tiles"></div>
    </div>
  </div>

  <script src="/static/admin-nav.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);

    Promise.all([
      fetch('/admin/feature-list'),
      fetch('/claims/unresolved'),
      fetch('/corrections?status=open'),
      fetch('/users'),
    ]).then((responses) => {
      if (responses.some((r) => r.status === 401 || r.status === 403)) {
        $('denied').hidden = false;
        return null;
      }
      return Promise.all(responses.map((r) => r.json()));
    }).then((data) => {
      if (!data) return;
      const [features, unresolved, corrections, users] = data;
      $('content').hidden = false;
      renderNav('admin', corrections.length);
      $('tiles').innerHTML = [
        ['/admin/features', features.length, 'features'],
        ['/admin/unresolved', unresolved.length, 'unresolved claims'],
        ['/corrections/queue', corrections.length, 'open corrections'],
        ['/admin/users', users.length, 'accounts'],
      ].map(([href, n, label]) =>
        '<a class="tile" href="' + href + '"><div class="n">' + n + '</div>' +
        '<div class="label">' + label + '</div></a>').join('');
    });
  </script>
</body>

</html>
