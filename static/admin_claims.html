<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-Z01BFBJM7V"></script>
  <script src="/static/analytics.js"></script>
  <title>Claims &middot; Wanderfall</title>
  <script src="/static/theme.js"></script>
  <link rel="stylesheet" href="/static/app.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Metamorphous&display=swap" rel="stylesheet">
  <style>
    body { padding: 0 0 64px; }
    .wrap { max-width: 900px; margin: 0 auto; padding: 0 16px; }
    a { color: var(--accent); }

    header.bar {
      display: flex; align-items: baseline; gap: 14px;
      flex-wrap: wrap; padding: 20px 0 6px;
    }
    header.bar h1 {
      margin: 0; font-family: 'Metamorphous', serif; font-weight: 400; font-size: 1.5rem;
    }
    header.bar nav { margin-left: auto; display: flex; gap: 12px; flex-wrap: wrap; }

    .group {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 13px 15px;
      margin-bottom: 12px;
    }
    .group.uncertain { border-style: dashed; }
    .group .top { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
    .group .source { font-weight: 600; text-transform: capitalize; }
    .group .url { font-size: 0.8rem; }
    .group .note { font-size: 0.85rem; color: var(--haze); margin: 6px 0 10px; }

    .badge {
      font-size: 0.64rem; text-transform: uppercase; letter-spacing: 0.1em;
      border: 1px solid var(--line); border-radius: 999px; padding: 2px 8px;
    }
    .badge.uncertain { border-color: var(--accent); color: var(--accent); }

    table.claims { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
    table.claims th { text-align: left; color: var(--haze); font-weight: 500; font-size: 0.72rem;
      text-transform: uppercase; letter-spacing: 0.06em; padding: 4px 8px 4px 0; }
    table.claims td { padding: 4px 8px 4px 0; border-top: 1px solid var(--line); vertical-align: top; }
    table.claims tr.accepted td:first-child { font-weight: 600; }
    .claim-note { color: var(--haze); font-size: 0.8rem; }

    .empty, .note { color: var(--haze); font-size: 0.9rem; }
  </style>
</head>

<body>
  <div class="wrap">
    <header class="bar">
      <h1 id="title">Claims</h1>
      <nav id="nav"></nav>
    </header>

    <div id="denied" class="empty" hidden>
      This view is for whoever looks after the data.
      <a href="/">Sign in on the map</a> if that's you.
    </div>

    <div id="missing" class="empty" hidden>No feature given. Go to <a href="/admin/features">Features</a> and pick one.</div>

    <div id="content" hidden>
      <p class="note"><a id="back" href="/admin/features">&larr; Back to Features</a> &middot;
        bold rows are what the site currently shows.</p>
      <div id="list"></div>
    </div>
  </div>

  <script src="/static/admin-nav.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const params = new URLSearchParams(location.search);
    const featureId = params.get('feature');
    const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    if (!featureId) {
      $('missing').hidden = false;
    } else {
      Promise.all([
        fetch('/claims?feature=' + featureId),
        fetch('/admin/feature-list'),
        fetch('/corrections?status=open'),
      ]).then((rs) => {
        if (rs.some((r) => r.status === 401 || r.status === 403)) {
          $('denied').hidden = false; return null;
        }
        return Promise.all(rs.map((r) => r.json()));
      }).then((data) => {
        if (!data) return;
        const [groups, features, corrections] = data;
        $('content').hidden = false;
        renderNav('features', corrections.length);
        const feature = features.find((f) => String(f.id) === featureId);
        if (feature) {
          $('title').textContent = 'Claims: ' + feature.name;
          document.title = feature.name + ' claims · Wanderfall';
        }
        render(groups);
      });
    }

    function valueText(v) {
      if (v && typeof v === 'object') {
        if ('lat' in v) return v.lat + ', ' + v.lon;
        return JSON.stringify(v);
      }
      return String(v);
    }

    function render(groups) {
      if (!groups.length) { $('list').innerHTML = '<p class="empty">No claims for this feature.</p>'; return; }
      $('list').innerHTML = groups.map((g) => {
        const rows = g.claims.map((c) =>
          '<tr class="' + (c.accepted ? 'accepted' : '') + '">' +
          '<td>' + esc(c.field) + '</td>' +
          '<td>' + esc(valueText(c.value)) + '</td>' +
          '<td>' + (c.accepted ? 'accepted' : '') + '</td>' +
          '<td class="claim-note">' + esc(c.note || '') + '</td>' +
          '</tr>').join('');
        return '<div class="group' + (g.identity_certain ? '' : ' uncertain') + '">' +
          '<div class="top">' +
          '<span class="source">' + esc(g.source) + '</span>' +
          (g.identity_certain ? '' : '<span class="badge uncertain">identity uncertain</span>') +
          (g.url ? '<span class="url"><a href="' + esc(g.url) + '" target="_blank" rel="noopener">' + esc(g.url) + '</a></span>' : '') +
          '</div>' +
          (g.note ? '<p class="note">' + esc(g.note) + '</p>' : '') +
          '<table class="claims"><tr><th>Field</th><th>Value</th><th></th><th>Note</th></tr>' + rows + '</table>' +
          '</div>';
      }).join('');
    }
  </script>
</body>

</html>
