# Render blueprint. The secrets are marked sync: false so they are set once in
# the dashboard and never live in the repository.
services:
  - type: web
    name: wanderfall
    runtime: go
    plan: starter
    region: ohio
    buildCommand: go build -o wanderfall . && go build -o migrate ./script/migrate
    # Runs after the build and before the new version takes traffic, so a
    # schema change ships with the code that needs it. Merging used to deploy
    # the binary alone: the area pages went live querying a slug column that
    # existed only on a laptop, and every one of them served a 500.
    #
    # A failed migration fails the deploy and the old version keeps serving,
    # which is the right way round.
    preDeployCommand: ./migrate
    startCommand: ./wanderfall
    healthCheckPath: /features
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: wanderfall-db
          property: connectionString
      - key: WANDERFALL_MAILGUN_DOMAIN
        value: mustmodify.com
      - key: WANDERFALL_SMTP_FROM
        value: Wanderfall <wanderful@mustmodify.com>
      - key: WANDERFALL_NOTIFY_EMAIL
        value: jw@mustmodify.com
      - key: WANDERFALL_MAILGUN_KEY
        sync: false

databases:
  - name: wanderfall-db
    plan: basic-256mb
    region: ohio
    postgresMajorVersion: "16"
